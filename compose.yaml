# Works with `podman compose up -d` (needs podman-compose or docker-compose installed)
# or use scripts/dev-up.ps1, which only needs podman.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5432:5432"
    volumes:
      - identity-pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: identity-redis
    ports:
      - "6379:6379"

  # Catches every email sent in development. Web UI: http://localhost:8025
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: identity-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  identity-pgdata:
